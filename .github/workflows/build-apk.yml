name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write  # needed to attach the APK to a GitHub Release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's docs say secrets cannot be referenced directly in `if:`
    # conditionals - the documented pattern is to mirror the secret into a
    # job-level env var first, then branch on that instead.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== Runner ==="
          uname -a
          echo "=== git ==="
          git --version
          echo "=== Working directory ==="
          pwd
          ls -la

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Show Node/npm versions
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Java version
        run: java -version

      - name: Install npm dependencies
        run: |
          echo "Running npm ci..."
          npm ci
          echo "npm ci complete."

      - name: Sync Capacitor Android platform
        run: |
          echo "Running npx cap sync android..."
          npx cap sync android
          echo "cap sync complete."

      - name: Decode release keystore (only if signing secrets are configured)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Release signing secret found - decoding keystore..."
          KEYSTORE_OUT="${GITHUB_WORKSPACE}/android/app/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_OUT"
          echo "Keystore written to $KEYSTORE_OUT ($(wc -c < "$KEYSTORE_OUT") bytes)"

      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building signed release APK with ./gradlew assembleRelease..."
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          echo "=== Release APK(s) ==="
          find app/build/outputs/apk/release -name '*.apk' -exec ls -la {} \;

      - name: Build debug APK (no release signing secrets configured)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        working-directory: android
        run: |
          echo "No KEYSTORE_BASE64 secret configured - building a debug-signed APK instead of a release APK."
          echo "NOTE: Android's debug keystore is regenerated per CI runner, so installing a newer debug APK over an older one may require uninstalling the previous install first. See NOTES.md / README.md for how to set up release signing instead."
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          echo "=== Debug APK(s) ==="
          find app/build/outputs/apk/debug -name '*.apk' -exec ls -la {} \;

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phomymo-android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found to attach to the release!" >&2
            exit 1
          fi
          echo "Attaching $APK to release ${{ github.ref_name }}..."
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "$APK" --clobber
          else
            gh release create "${{ github.ref_name }}" "$APK" --title "${{ github.ref_name }}" --generate-notes
          fi
          echo "Release step complete."
